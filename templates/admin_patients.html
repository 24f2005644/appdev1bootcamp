<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card-soft">
            <div class="page-header px-4 py-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <h2 class="mb-0">Patient Search</h2>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-light">Back to Dashboard</a>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="get" class="row g-2 align-items-center mb-4">
                    <div class="col-md-10">
                        <input type="search" name="q" class="form-control form-control-lg" placeholder="Search by name, email, or phone" value="{{ search_query }}">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Search</button>
                    </div>
                </form>

                <div class="list-group">
                    {% for patient in patients %}
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1">{{ patient.user.name }}</h5>
                                <div>{{ patient.user.email }}</div>
                                <small class="text-muted">{{ patient.phone }}</small>
                            </div>
                            <span class="badge {{ 'bg-success' if patient.user.is_active else 'bg-secondary' }}">
                                {{ 'Active' if patient.user.is_active else 'Inactive' }}
                            </span>
                        </div>
                    {% else %}
                        <div class="list-group-item text-muted">No matching patients.</div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
