<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Reschedule Appointment</h1>
    <p> Doctor: {{ appointment.doctor.user.name }}</p>
    <p> Choose a date and time listed in the doctor's availability</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="alert alert-{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method = "post">
        <label>Date <input type="date" name="appointment_date" required></label>
        <label>Time <input type="time" name="appointment_time" required></label>
        <button type="submit">Reschedule</button>
    </form>

    <p><a href="{{ url_for('patient_dashboard')}}">Back to dashboard</a></p>

</body>
</html>
