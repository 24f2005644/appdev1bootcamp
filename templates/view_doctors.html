<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Available Doctors</h1>
    <from method="get">
        <input type="text" name="q" value="{{ query }}" placeholder="Search by name or specialization">
        <button type="submit">Search</button>
    </from>

    {% for doctor in doctors %}
        <div>
            <h2>{{ doctor.user.name }}</h2>
            <p>{{ doctor.specialization }} - {{ doctor.department.name }}</p>
            <p>Email: {{ doctor.user.email }}</p>
            <a href="{{ url_for('doctor_availability', doctor_id=doctor.id) }}">View Availability</a>
        </div>
    {% else %}
        <p>No doctors found.</p>
    {% endfor %}

    <p><a href="{{ url_for('patient_dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
