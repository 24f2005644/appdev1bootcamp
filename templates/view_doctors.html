<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card-soft">
            <div class="page-header px-4 py-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <h2 class="mb-0">Available Doctors</h2>
                    <a href="{{ url_for('patient_dashboard') }}" class="btn btn-outline-light">Back to Dashboard</a>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="get" class="row g-2 align-items-center mb-4">
                    <div class="col-md-10">
                        <input type="search" class="form-control form-control-lg" name="q" value="{{ query }}" placeholder="Search by name or specialization">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Search</button>
                    </div>
                </form>

                {% for doctor in doctors %}
                <div class="doctor-card p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <h4 class="mb-1">{{ doctor.user.name }}</h4>
                            <p class="mb-1 text-primary">{{ doctor.specialization }} - {{ doctor.department.name }}</p>
                            <p class="mb-0 text-muted">Email: {{ doctor.user.email }}</p>
                        </div>
                        <a href="{{ url_for('doctor_availability', doctor_id=doctor.id) }}" class="btn btn-primary">View Availability</a>
                    </div>
                </div>
                {% else %}
                <div class="alert alert-light border">No doctors found.</div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
