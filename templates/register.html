<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Register Page </h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="alert alert-{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}
    <form method="post">
        <label for="name">Name <input type="text" name="name" required></label>
        <label for="email">Email <input type="email" name="email" required></label>
        <label for="password">Password <input type="password" name="password" required></label>
        <button type="submit">Register</button>

    </form>
    <p>
        <a href="{{ url_for('login') }}">Already have an account? Login here</a>
    </p>
</body>
</html>
