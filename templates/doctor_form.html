<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{"Edit" if doctor else "Add"}} doctor</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="alert alert-{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="post">
        <label for ="name">Name <input type="text" name="name" value="{{ doctor.user.name if doctor else '' }}" required></label>
    </form>
</body>
</html>
