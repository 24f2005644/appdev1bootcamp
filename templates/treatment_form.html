<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Add Treatment</h1>
    <p>Appointment with {{ appointment.patient.user.name }} on {{ appointment.date }} at {{ appointment.time }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="alert alert-{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="post">
        <label>Diagnosis
            <textarea name="diagnosis" required>{{ appointment.treatment.diagnosis if appointment.treatment else '' }}</textarea>
        </label>
        <label>Treatment Notes
            <textarea name="treatment_notes" required>{{ appointment.treatment.treatment_notes if appointment.treatment else '' }}</textarea>
        </label>
        <label>Prescription
            <textarea name="prescription" required>{{ appointment.treatment.prescription if appointment.treatment else '' }}</textarea>
        </label>
        <button type="submit">Save Treatment</button>
    </form>
    <a href="{{ url_for('doctor_dashboard') }}">Back to Dashboard</a>
</body>
</html>
